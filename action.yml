name: Contribution Village
description: Turn a GitHub contribution graph into a little village SVG.
branding:
  icon: home
  color: green
inputs:
  username:
    description: GitHub user whose contribution graph becomes the village.
    default: ${{ github.repository_owner }}
  path:
    description: Where to write the SVG, relative to the workspace. The night version for dark mode goes next to it, with -dark added to the name.
    default: village.svg
  token:
    description: Token for reading the contribution graph from the GitHub API. The workflow's own token works.
    default: ${{ github.token }}
runs:
  using: node24
  main: village.js
